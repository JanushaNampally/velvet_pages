{% extends "auth/base_auth.html" %}
{% block auth %}
{% if google_ready %}<a class="btn wide" href="{% url 'google_start' %}?mode=login">Sign in with Google</a>
<div class="or">or</div>{% endif %}
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}{{ form.as_div }}
  <button class="btn wide alt">Log in with password</button>
</form>
<p class="muted small">Forgot your password? Sign in with Google, then set a new one in Settings.</p>
{% endblock %}
