{% extends "auth/base_auth.html" %}
{% block auth %}
{% if dev_code %}<div class="msg warning">Dev mode (no SMS provider set): your code is <b>{{ dev_code }}</b></div>{% endif %}
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}{{ form.as_div }}
  <button class="btn wide">Set new password</button>
</form>
<p class="muted small"><a href="{% url 'login' %}">Back to login</a></p>
{% endblock %}
